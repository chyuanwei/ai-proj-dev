name: Deploy to GAS

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json
        env:
          # 使用環境變數傳遞，絕對不要在 run 裡面用 ${{ }}
          CLASPRC_JSON_RAW: ${{ secrets.CLASPRC_JSON }}
        run: |
          # 建立家目錄並寫入檔案
          mkdir -p ~/.clasprc.json
          echo "$CLASPRC_JSON_RAW" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Deploy to GAS
        run: |
          # 強制覆蓋 push 到 GAS 平台
          clasp push -f