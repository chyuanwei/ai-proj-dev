name: Deploy Google Apps Script to GAS

on:
  push:
    branches:
      - dev # 当推送到 dev 分支时触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 或者你项目使用的 Node.js 版本

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          cat ~/.clasprc.json # for debugging, remove in production
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push code to Google Apps Script
        run: npx @google/clasp push --force
        working-directory: ${{ github.workspace }}

