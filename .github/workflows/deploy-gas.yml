name: Deploy Google Apps Script to GAS

on:
  push:
    branches:
      - dev # 当推送到 dev 分支时触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 或者你项目使用的 Node.js 版本

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        run: |
          # 将 CLASPRC_JSON Secret 的内容直接写入 ~/.clasprc.json
          echo "${{ secrets.CLASPRC_JSON }}" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json # 确保权限正确
          echo "--- Debug: ~/.clasprc.json content ---"
          cat ~/.clasprc.json
          echo "--- End Debug ---"
          echo "CLASP_CREDENTIALS=~/.clasprc.json" >> $GITHUB_ENV # 设置环境变量
          ls -la ~ # 检查家目录文件列表和权限
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push code to Google Apps Script
        run: npx @google/clasp push --force
        working-directory: ${{ github.workspace }}

      - name: Deploy to Google Apps Script Web App
        run: |
          DEPLOYMENT_ID="AKfycbxl1BaKd_AgfBLeS-fNfdKcB1BrfVjY_V-ZS9CdjqydHZdqtgBsyFwaujnnTKLbTB3gGQ"
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          npx @google/clasp deploy -i $DEPLOYMENT_ID -d "GitHub Actions Auto-Deploy - $TIMESTAMP"
        working-directory: ${{ github.workspace }}
