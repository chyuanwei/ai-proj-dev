<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泉威食品 - 線上訂購系統</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAACXBIWXMAAAsTAAALEwEAmpwYAAAA">
    <style>
        :root { --primary: #5d4037; --bg: #f8f9fa; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .card { background: white; max-width: 450px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #ccc; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>泉威食品 訂購單</h2>
    <form id="orderForm">
        <div class="field">
            <label>訂購人姓名</label>
            <input type="text" id="orderer" required>
        </div>
        <div class="field">
            <label>聯絡電話</label>
            <input type="tel" id="phone" required>
        </div>
        <div class="field">
            <label>選擇產品</label>
            <select id="product">
                <option value="招牌豆花">招牌豆花</option>
                <option value="傳統布丁">傳統布丁</option>
                <option value="限定產品">限定產品</option>
            </select>
        </div>
        <div class="field">
            <label>備註</label>
            <textarea id="note" rows="2"></textarea>
        </div>
        <button type="submit" id="submitBtn">確認送出</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // ⚠️ 請確保這是你最新的 /exec 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzJPcsBSfJPp4mEtBYqaCu0JeQn3IrCCCGLwyKm8sn_18G0GBXbRQONK0igj2w5Qdrtng/exec";

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        status.innerText = "正在傳送訂單...";

        // 構建符合後端期待的 JSON 結構
        const payload = {
            action: "submitOrder",
            orderer: document.getElementById('orderer').value,
            phone: document.getElementById('phone').value, // 擴充欄位
            products: [
                {
                    name: document.getElementById('product').value,
                    quantity: 1
                }
            ],
            note: document.getElementById('note').value
        };

        fetch(`${GAS_URL}?action=submitOrder`, {
            method: 'POST',
            mode: 'no-cors', // 避開預檢請求
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
